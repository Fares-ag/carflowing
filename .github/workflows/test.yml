name: Test Suite

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint --workspaces --if-present

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:conventions
      - run: npm run test:gaps
      # Ops scripts under scripts/ had no runner: their node:test suite existed but was
      # never executed by CI, so nothing guarded the credential handling in them.
      - run: npm run test:scripts

  lint-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint:strict

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The scan itself refuses to report a pass when rg is missing, but install it
      # here so a runner image change degrades into a slower job, not a red gate.
      - name: Ensure ripgrep is installed
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi
      - name: Scan for assigned secret values
        run: bash scripts/scan-secrets.sh

  # Non-blocking, production-dependencies-only. `npm audit --audit-level=high` as a
  # hard gate blocked every deploy on unrelated third-party advisories — including
  # dev-only ones (vite/vitest/eslint) that never reach a production container. An
  # advisory should page someone, not stand between an incident and its hotfix, so
  # this job reports and never fails the workflow (or the deploy that calls it).
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit production dependencies (advisory only)
        run: npm audit --omit=dev --audit-level=high

  unit-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:api

  frontend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test --workspace=packages/shared
      - run: npm run test --workspace=apps/customer
      - run: npm run test --workspace=apps/dealer
      - run: npm run test --workspace=apps/admin

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Every project in playwright.config.ts (including 'mobile', pinned to the
      # Chromium-based Pixel 7) runs on chromium. Adding a WebKit project means
      # adding webkit here too, or the suite silently cannot run.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
