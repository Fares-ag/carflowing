# DEPRECATED — use Railway (railway.toml at repo root) for production API deploy.
# Kept for reference only; not used by CI.

app = 'carflow-api'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'
  build-context = '../..'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '15s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[env]
  PORT = '8080'
  NODE_ENV = 'production'
